# Deployment template for one agent: startAgent runs the HTTP endpoint and the
# scheduled jobs together. This is the shape to deploy to a Phala CVM, which
# runs a compose file rather than building one. Copy it per agent and pin that
# agent's own image digest (see Dockerfile: one image per agent).
#
# This file is the thing Phala hashes and publishes in the agent's Trust Center
# report, so two rules matter:
#
#   1. Pin the image by digest. A tag can be repointed at different bytes after
#      the fact, which makes the report prove nothing about the code. The digest
#      is what ties the report to this repository's skills and prompts.
#   2. Secrets go in as ${VARS}, declared in the Phala dashboard. The file is
#      public; the values are not substituted into it.

services:
  agent:
    # Literal digest, never a ${VAR} and never a tag. Phala hashes this file, so
    # a variable here would commit the attestation to a placeholder rather than
    # to actual bytes, and a tag can be repointed after the fact.
    image: kudosinichi/kudo-agent@sha256:275c462973a43f58bb0fa2c8b41d6f9ebe0484dc36f52cf4dad4a57c27953ea1
    # The pin above is the last image built from the old single-image layout.
    # Replace it with the digest of the agent image you build and push.
    # Local development builds instead; comment out `image` above when using it:
    # build: { context: ../.., dockerfile: packages/sdk/Dockerfile, args: { AGENT: agents/shinichi } }
    environment:
      PORT: "3000"
      # Who owns settlement, and it must be exactly one party. Set to 0 when the
      # conductor settles - an agent running its own settler alongside it is not
      # a backstop, it is a second party paying the same promise. A number is
      # only correct when nothing else is settling for this agent.
      TICK_INTERVAL_SECONDS: ${TICK_INTERVAL_SECONDS}
      JOBS: ${JOBS}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      PRIVATE_KEY: ${PRIVATE_KEY}
      RPC_URL: ${RPC_URL}
      KUDO_SPONSOR_URL: ${KUDO_SPONSOR_URL}
      KUDO: ${KUDO}
      USDG: ${USDG}
      IDENTITY_REGISTRY: ${IDENTITY_REGISTRY}
      AGENT_NAME: ${AGENT_NAME}
      AGENT_ENDPOINT: ${AGENT_ENDPOINT}
      TWITTER_API_KEY: ${TWITTER_API_KEY}
      TWITTER_API_SECRET_KEY: ${TWITTER_API_SECRET_KEY}
      TWITTER_ACCESS_TOKEN: ${TWITTER_ACCESS_TOKEN}
      TWITTER_ACCESS_TOKEN_SECRET: ${TWITTER_ACCESS_TOKEN_SECRET}
      TWITTER_HANDLE: ${TWITTER_HANDLE}
    volumes:
      # How the agent learns its own Phala app id at startup. Without this the
      # agent still runs, but registers no `teeId` and has no report to point at.
      - /var/run/dstack.sock:/var/run/dstack.sock
    ports:
      - "3000:3000"
    restart: unless-stopped
    # Let a settlement round in flight finish rather than killing it between a
    # payment and its attestation.
    stop_grace_period: 180s
