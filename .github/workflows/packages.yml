# Unit tests for the public Kudo packages. Never publishes anything.
name: packages

on:
  pull_request:
    paths: ["packages/**", "skills/**", "kudo-agent/.claude/skills/**", "kudo-agent/prompts/**", "kudo-agent/agents/**", "scripts/**", "e2e/**", "package.json", "package-lock.json", ".github/workflows/packages.yml"]
  push:
    branches: [main]
    paths: ["packages/**", "skills/**", "kudo-agent/.claude/skills/**", "kudo-agent/prompts/**", "kudo-agent/agents/**", "scripts/**", "e2e/**", "package.json", "package-lock.json", ".github/workflows/packages.yml"]
  workflow_dispatch:
    inputs:
      e2e:
        description: "Also run the signed e2e suites on a local mainnet fork (slow; uses the public RPC)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:addresses
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  e2e:
    if: github.event_name == 'workflow_dispatch' && inputs.e2e
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - run: npm i -g @foundry-rs/cast
      - working-directory: e2e
        run: npm ci && ./run.sh
      - name: SKILL.md verbatim
        working-directory: e2e
        run: |
          npx hardhat node --config hardhat.config.cjs --port 8545 > hardhat.log 2>&1 &
          for _ in $(seq 1 60); do curl -sf http://127.0.0.1:8545 -H 'content-type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' >/dev/null && break; sleep 1; done
          sudo -E env "PATH=$PATH" ./skill/run.sh
